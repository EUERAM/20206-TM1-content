<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Javascript Video Exercice</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <div class="container">
      <button class="play">Play</button>
      <button class="stop" onclick="stopVideo()">Stop</button>
      <video src="medias/video.mp4" autoplay muted loop></video>
      <iframe
        src="https://www.youtube.com/embed/r6g0dF053eE?si=XI71CL3wMWK4UU1k"
        title="YouTube video player"
        frameborder="0"
        allow="
          accelerometer;
          autoplay;
          clipboard-write;
          encrypted-media;
          gyroscope;
          picture-in-picture;
          web-share;
        "
        referrerpolicy="strict-origin-when-cross-origin"
        allowfullscreen
      ></iframe>
    </div>

    <script src="js/script.js"></script>
  </body>
</html>
