<!doctype html>
<!-- The html element is the root of the page. -->
<html lang="en">
  <head>
    <!-- The head contains page information and links, not visible content. -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My First Page</title>
    <!-- Load the page's styles from a separate CSS file. -->
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <!-- Visible page content belongs inside the body. -->
    <h1>Hello, world!</h1>
    <p>This is my first HTML page.</p>
  </body>
</html>
