<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Viewport settings let the narrow-screen media query match phones. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Media Queries</title>
    <!-- The responsive layout is controlled by this stylesheet. -->
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <main>
      <h1>A layout that adapts</h1>
      <!-- The same two panels are used at every screen size. -->
      <div class="panels">
        <section class="panel">
          <h2>Morning</h2>
          <p>Light, fresh, and ready for the day.</p>
        </section>
        <section class="panel">
          <h2>Evening</h2>
          <p>Quiet, warm, and time to slow down.</p>
        </section>
      </div>
    </main>
  </body>
</html>
