<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grid Layout</title>
    <!-- The grid rules are in the linked CSS file. -->
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <main>
      <h1>A grid of six items</h1>
      <!-- This parent defines the grid; each child fills a grid cell. -->
      <div class="grid-container">
        <div class="grid-item">One</div>
        <div class="grid-item">Two</div>
        <div class="grid-item">Three</div>
        <div class="grid-item">Four</div>
        <div class="grid-item">Five</div>
        <div class="grid-item">Six</div>
      </div>
    </main>
  </body>
</html>
