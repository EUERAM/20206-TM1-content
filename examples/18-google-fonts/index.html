<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Google Fonts</title>
    <!-- Preconnect helps the browser prepare its connection to Google Fonts. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Load the Poppins family in regular and semibold weights. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <!-- Keep local page styles separate from external font loading. -->
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <main>
      <p class="eyebrow">A type sample</p>
      <h1>Words have a voice.</h1>
      <p>This sentence uses Poppins, with a sans-serif fallback.</p>
    </main>
  </body>
</html>
