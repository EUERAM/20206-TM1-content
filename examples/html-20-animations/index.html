<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS Animation</title>
    <!-- The keyframes and animation are defined in this stylesheet. -->
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <main>
      <h1>A bouncing dot</h1>
      <!-- The decorative dot is animated by CSS without a user trigger. -->
      <div class="stage" role="img" aria-label="A dot bouncing up and down">
        <span class="dot"></span>
      </div>
    </main>
  </body>
</html>
