<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HTML Links</title>
    <!-- Load the stylesheet using a path relative to this HTML file. -->
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <main>
      <h1>Learning about links</h1>

      <!-- This anchor link jumps to the heading with the matching ID below. -->
      <p><a href="#tips">Jump to the tip</a></p>

      <!-- This external link opens another website in a new tab. -->
      <p>
        <a href="https://developer.mozilla.org/en-US/docs/Web/HTML/Element/a"
          >Read about links on MDN</a
        >
      </p>

      <h2 id="tips">Link tip</h2>
      <p>Use a short, descriptive label so people know where a link goes.</p>
    </main>
  </body>
</html>
