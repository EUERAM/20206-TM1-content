<style>
  :root{
    --bg:#f3f1ec; --ink:#141414; --muted:#6b6a66; --line:#d9d6ce; --card:#fffdf8;
    --accent:#ff4f1f;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#111110; --ink:#f1efe9; --muted:#9a988f; --line:#2c2b28; --card:#1a1917; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Space Grotesk",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1280px;margin:0 auto;padding:36px 28px 80px}
  .toprow{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
  .seg{display:inline-flex;padding:4px;border:1.5px solid var(--line);border-radius:999px;background:var(--card);flex:none}
  .seg button{font:500 13px "JetBrains Mono",monospace;padding:8px 16px;border:0;border-radius:999px;background:transparent;color:var(--muted);cursor:pointer}
  .seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
  header{display:grid;grid-template-columns:1fr auto;gap:24px;align-items:end;border-bottom:2px solid var(--ink);padding-bottom:28px}
  .eyebrow{font-family:"JetBrains Mono",monospace;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  h1{font-size:clamp(40px,7vw,96px);line-height:.92;margin:0;font-weight:700;letter-spacing:-.035em}
  h1 em{font-style:normal;color:var(--accent)}
  .stats{display:flex;gap:28px;font-family:"JetBrains Mono",monospace}
  .stat b{display:block;font-family:"Space Grotesk";font-size:36px;font-weight:700;line-height:1}
  .stat span{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
  .controls{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin:24px 0 32px}
  .search{flex:1 1 260px;font:inherit;font-size:16px;padding:12px 16px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;outline:none}
  .search:focus{border-color:var(--ink)}
  .chip{font:500 13px "JetBrains Mono",monospace;padding:10px 14px;border-radius:999px;border:1.5px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
  .chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px}
  .card{background:var(--card);border:1.5px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;transition:transform .2s ease,border-color .2s}
  .card:hover{transform:translateY(-3px);border-color:var(--ink)}
  .cover{aspect-ratio:16/10;position:relative;display:flex;align-items:flex-end;padding:18px;color:#fff;text-decoration:none;overflow:hidden}
  .cover::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 85% 15%,rgba(255,255,255,.35),transparent 45%);pointer-events:none}
  .cover.shot{padding:0;background:#111;border-bottom:1.5px solid var(--line)}
  .cover.shot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top center;transition:transform .4s ease}
  .card:hover .cover.shot img{transform:scale(1.03)}
  .cover.shot::after{background:linear-gradient(to bottom,rgba(0,0,0,.45),transparent 30%)}
  .proj{font:400 12px "JetBrains Mono",monospace;color:var(--muted);margin-top:3px}
  .btn.icon{padding:8px;gap:0;position:relative}
  .btn.icon svg{width:17px;height:17px}
  .btn.icon sup{position:absolute;top:1px;right:3px}
  .btn.icon .m{position:absolute;bottom:1px;right:3px;font-size:9px;font-weight:700;color:var(--muted)}
  .cover .t{position:relative;z-index:1;font-size:30px;font-weight:700;letter-spacing:-.03em;line-height:.95;text-shadow:0 1px 12px rgba(0,0,0,.18)}
  .cover .n{position:absolute;top:12px;left:12px;z-index:1;font:700 11px "JetBrains Mono",monospace;letter-spacing:.06em;text-transform:uppercase;color:#fff;background:rgba(20,20,20,.82);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);padding:6px 10px;border-radius:999px}
  .cover .open{position:absolute;top:12px;right:14px;z-index:1;font:500 11px "JetBrains Mono",monospace;background:rgba(0,0,0,.28);padding:5px 9px;border-radius:999px;opacity:0;transition:opacity .2s}
  .card:hover .open{opacity:1}
  .cover.none{color:var(--muted);background:repeating-linear-gradient(45deg,var(--bg),var(--bg) 10px,var(--card) 10px,var(--card) 20px)!important}
  .cover.none::after{display:none}
  .cover.none .t{text-shadow:none}
  .body{padding:16px 18px 18px;display:flex;flex-direction:column;gap:12px;flex:1}
  .who{min-width:0}
  .who .ttl{font-size:18px;font-weight:600;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .who small{display:block;font:400 12px "JetBrains Mono",monospace;color:var(--muted);margin-top:3px}
  .links{display:flex;flex-wrap:wrap;gap:8px;margin-top:auto}
  .btn{display:inline-flex;align-items:center;gap:6px;font:500 12px "JetBrains Mono",monospace;padding:8px 11px;border-radius:10px;border:1.5px solid var(--line);color:var(--ink);text-decoration:none}
  .btn:hover{border-color:var(--ink);background:var(--bg)}
  .btn svg{width:14px;height:14px;flex:none}
  .btn.off{opacity:.38;pointer-events:none;border-style:dashed}
  .btn sup{color:var(--accent);font-size:11px}
  .ratings{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;align-items:center;padding:10px 12px;border-radius:12px;background:var(--bg);font-family:"JetBrains Mono",monospace;font-size:12px}
  .ratings dt{color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-size:11px}
  .ratings dd{margin:0;display:flex;gap:2px;color:var(--accent)}
  .ratings dd svg{width:15px;height:15px}
  .ratings .pending{color:var(--muted);font-style:italic;font-size:11px}
  body.hide-ratings .ratings{display:none}
  .sep{width:1px;height:28px;background:var(--line);margin:0 4px}
  .empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:60px 0;font-family:"JetBrains Mono",monospace}
  footer{margin-top:48px;padding-top:20px;border-top:1px solid var(--line);font-size:13px;color:var(--muted);line-height:1.6}
  footer sup{color:var(--accent)}
  @media (max-width:720px){header{grid-template-columns:1fr}.stats{gap:20px}}
</style>
</head>

const icons = {
  web:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg>',
  gh:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-3.2 19.5c.5.1.7-.2.7-.5v-1.7c-2.8.6-3.4-1.3-3.4-1.3-.5-1.2-1.1-1.5-1.1-1.5-.9-.6.1-.6.1-.6 1 .1 1.5 1 1.5 1 .9 1.6 2.4 1.1 3 .9.1-.7.4-1.1.6-1.4-2.2-.3-4.6-1.1-4.6-5a3.9 3.9 0 0 1 1-2.7c-.1-.3-.4-1.3.1-2.7 0 0 .8-.3 2.8 1a9.6 9.6 0 0 1 5 0c1.9-1.3 2.8-1 2.8-1 .5 1.4.2 2.4.1 2.7a3.9 3.9 0 0 1 1 2.7c0 3.9-2.3 4.7-4.6 5 .4.3.7.9.7 1.9V21c0 .3.2.6.7.5A10 10 0 0 0 12 2z"/></svg>',
  fg:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 2h4v6.7H8A3.3 3.3 0 0 1 8 2zm4 0h4a3.3 3.3 0 0 1 0 6.7h-4zm0 6.7h4a3.3 3.3 0 1 1 0 6.6 3.3 3.3 0 0 1-4-3.3zM8 8.7h4v6.6H8a3.3 3.3 0 0 1 0-6.6zm0 6.6h4v3.4A3.3 3.3 0 1 1 8 15.3z"/></svg>'
};

const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function hue(str){let h=0;for(const c of str)h=(h*31+c.charCodeAt(0))%360;return h}
function btn(kind,label,url,inf,mark){
  const m = mark ? `<span class="m">${mark}</span>` : '';
  if(!url) return `<span class="btn icon off" title="${label}: not submitted" aria-label="${label}: not submitted">${icons[kind]}</span>`;
  return `<a class="btn icon" href="${esc(url)}" target="_blank" rel="noopener" title="${label}" aria-label="${label}">${icons[kind]}${m}</a>`;
}
const SHOT = {"Alemany Ruz":"alemany","Badia Arbós":"badia","Buxadé Bielsa":"buxade","Camps Piris":"camps","Carbó Campoy":"carbo-ona","Carbó Rigau":"carbo-pau","Esteve Lliuró":"esteve","Etouil Sorhayer":"etouil","Formiga Yeste":"formiga","Frigola Formiga":"frigola","García Bigatà":"garcia","Martínez Gallardo":"martinez","Matamala i Prat":"matamala","Moreu Punsola":"moreu","Nogué i Debia":"nogue","Pagà Fernández":"paga","Pujadas i Canals":"pujadas","Ramos Montañés":"ramos","Ruiz Pellicer":"ruiz","Sardà i Roca":"sarda","Sevilla Lagos":"sevilla","Sierra Jiménez":"sierra","Yakubiak":"yakubiak","Turró Graells":"turro"};

const LABEL = {'Portfolio':'Personal portfolio','Startup / App':'Startup / App launch','Music':'Music','Activism':'Storytelling & activism','Others':'Others'};
const STAR = 'M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3l-5.9 3.3 1.3-6.6-4.9-4.6 6.6-.8z';
function stars(score){
  // score 0–10 → 0–5 stars in half steps
  const v = Math.round(score) / 2;
  let out = '';
  for(let k=1;k<=5;k++){
    const fill = v >= k ? 1 : (v >= k-0.5 ? 0.5 : 0);
    const id = 'h'+Math.random().toString(36).slice(2,8);
    out += `<svg viewBox="0 0 24 24" aria-hidden="true">
      <defs><linearGradient id="${id}"><stop offset="${fill*100}%" stop-color="currentColor"/><stop offset="${fill*100}%" stop-color="transparent"/></linearGradient></defs>
      <path d="${STAR}" fill="url(#${id})" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>`;
  }
  return out;
}
const total = p => (p.r && p.r.every(x => x !== null)) ? p.r.reduce((a,b)=>a+b,0) : null;
function ratingBlock(p){
  if(!p.r) return '';
  const rows = ['UX','UI','Dev'].map((label,i) => {
    const s = p.r[i];
    return s === null
      ? `<dt>${label}</dt><dd class="pending">Pending</dd>`
      : `<dt>${label}</dt><dd aria-label="${label}: ${Math.round(s)/2} out of 5 stars">${stars(s)}</dd>`;
  }).join('');
  return `<dl class="ratings">${rows}</dl>`;
}

const stats = document.getElementById('stats');
const count = k => P.filter(p => p[k]).length;
function renderStats(){
  const S = P.filter(p => typeof group==='undefined' || group==='all' || p.g===group);
  const c = k => S.filter(p => p[k]).length;
  stats.innerHTML = [[S.length,'Projects'],[c('web'),'Live sites']]
    .map(([n,l]) => `<div class="stat"><b>${n}</b><span>${l}</span></div>`).join('');
}

const grid = document.getElementById('grid');
let filter = 'all', group = 'all', q = '', sortByRating = false;
renderStats();
function render(){
  const norm = s => s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
  const nq = norm(q);
  const list = P.filter(p => (filter==='all' || p.k===filter) && (group==='all' || p.g===group) &&
    (!nq || norm(`${p.f} ${p.s} ${p.t}`).includes(nq)));
  if(sortByRating) list.sort((a,b) => (total(b) ?? -1) - (total(a) ?? -1));
  if(!list.length){grid.innerHTML='<div class="empty">No projects match.</div>';return}
  grid.innerHTML = list.map(p => {
    const i = P.filter(x=>x.g===p.g).indexOf(p)+1, h = hue(p.t+p.s);
    const bg = `linear-gradient(135deg, hsl(${h} 78% 52%), hsl(${(h+48)%360} 82% 40%))`;
    const coverInner = `<span class="n">${esc(LABEL[p.k])}</span><span class="t">${esc(p.t)}</span>`;
    const tag = `<span class="n">${esc(LABEL[p.k])}</span>`;
    const shot = p.img || SHOT[p.s];
    const img = shot ? `<img src="img/${shot}.jpg" alt="Screenshot of ${esc(p.t)}" width="480" height="300" loading="lazy">` : '';
    let cover;
    if(shot && p.web) cover = `<a class="cover shot" href="${esc(p.web)}" target="_blank" rel="noopener">${img}${tag}<span class="open">Open site ↗</span></a>`;
    else if(shot) cover = `<div class="cover shot">${img}${tag}</div>`;
    else cover = `<div class="cover none">${coverInner}</div>`;
    const extra = (p.extra||[]).map(([l,k,u]) => btn(k,l,u,false,'m')).join('');
    return `<article class="card">${cover}
      <div class="body">
        <div class="who"><div class="ttl" title="${esc(p.t)}">${esc(p.t)}</div><div class="proj">${esc(p.f)} ${esc(p.s)}</div></div>
        ${ratingBlock(p)}
        <div class="links">${btn('web','Site',p.web,p.webInf)}${btn('gh','GitHub',p.gh,p.ghInf)}${btn('fg','Figma',p.fg)}${extra}</div>
      </div></article>`;
  }).join('');
}
document.getElementById('q').addEventListener('input', e => {q = e.target.value; render()});
document.getElementById('sortBtn').addEventListener('click', e => {
  sortByRating = !sortByRating; e.target.setAttribute('aria-pressed', sortByRating); render();
});
document.getElementById('rateBtn').addEventListener('click', e => {
  const shown = document.body.classList.toggle('hide-ratings') === false;
  e.target.setAttribute('aria-pressed', shown);
  e.target.textContent = shown ? 'Ratings shown' : 'Ratings hidden';
});
document.querySelectorAll('.chip[data-f]').forEach(c => c.addEventListener('click', () => {
  document.querySelectorAll('.chip[data-f]').forEach(x => x.setAttribute('aria-pressed','false'));
  c.setAttribute('aria-pressed','true'); filter = c.dataset.f; render();
}));
document.querySelectorAll('.seg [data-g]').forEach(c => c.addEventListener('click', () => {
  document.querySelectorAll('.seg [data-g]').forEach(x => x.setAttribute('aria-pressed','false'));
  c.setAttribute('aria-pressed','true'); group = c.dataset.g; render(); renderStats();
}));
render();
</script>
