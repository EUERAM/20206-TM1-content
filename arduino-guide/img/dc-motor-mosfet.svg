<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" role="img" aria-labelledby="title desc">
  <title id="title">Driving a DC motor with a MOSFET</title>
  <desc id="desc">Arduino pin 9 goes through a 220 ohm resistor to the gate of an IRLZ44N MOSFET, with a 10 kilohm resistor from the gate to GND. The motor connects between the motor supply's plus and the MOSFET's drain, with a 1N4007 flyback diode across the motor. The MOSFET's source, the supply's minus, and the Arduino GND are all connected.</desc>
  <rect width="560" height="300" rx="18" fill="#eef0f8"/>
  <rect x="20" y="20" width="520" height="260" rx="12" fill="#fff"/>

  <!-- Arduino -->
  <text x="40" y="102" font-family="sans-serif" font-size="12" font-weight="700" fill="#1f2937">Arduino</text>
  <rect x="40" y="110" width="90" height="150" rx="8" fill="#0f766e"/>
  <g font-family="sans-serif" font-weight="700" fill="#fff" font-size="13" text-anchor="end">
    <text x="122" y="165">~9</text>
    <text x="122" y="255">GND</text>
  </g>

  <!-- gate resistor -->
  <path d="M130 160 H170 M210 160 H290" stroke="#f97316" stroke-width="4"/>
  <rect x="170" y="152" width="40" height="16" rx="3" fill="#fde68a" stroke="#1f2937" stroke-width="2"/>
  <text x="190" y="146" font-family="sans-serif" font-size="11" font-weight="700" fill="#1f2937" text-anchor="middle">220 Ω</text>

  <!-- gate pull-down -->
  <circle cx="250" cy="160" r="4.5" fill="#1f2937"/>
  <path d="M250 160 V190 M250 226 V250" stroke="#1f2937" stroke-width="3"/>
  <rect x="242" y="190" width="16" height="36" rx="3" fill="#fde68a" stroke="#1f2937" stroke-width="2"/>
  <text x="264" y="212" font-family="sans-serif" font-size="11" font-weight="700" fill="#1f2937">10 kΩ</text>

  <!-- MOSFET -->
  <rect x="290" y="135" width="70" height="55" rx="6" fill="#e5e7eb" stroke="#1f2937" stroke-width="2"/>
  <g font-family="sans-serif" fill="#1f2937">
    <text x="296" y="166" font-size="11" font-weight="700">G</text>
    <text x="325" y="149" font-size="11" font-weight="700" text-anchor="middle">D</text>
    <text x="325" y="185" font-size="11" font-weight="700" text-anchor="middle">S</text>
    <text x="334" y="166" font-size="9" text-anchor="middle">IRLZ44N</text>
  </g>

  <!-- drain to motor, source to ground -->
  <path d="M325 135 V95 M325 190 V250" stroke="#1f2937" stroke-width="3"/>

  <!-- motor -->
  <circle cx="325" cy="75" r="20" fill="#e5e7eb" stroke="#1f2937" stroke-width="3"/>
  <text x="325" y="81" font-family="sans-serif" font-size="16" font-weight="700" fill="#1f2937" text-anchor="middle">M</text>

  <!-- supply + rail -->
  <path d="M325 55 V40 H470 V62" fill="none" stroke="#dc2626" stroke-width="3" stroke-linejoin="round"/>

  <!-- flyback diode across the motor -->
  <circle cx="380" cy="40" r="4.5" fill="#dc2626"/>
  <path d="M380 40 V62 M380 82 V112 H325" fill="none" stroke="#1f2937" stroke-width="3" stroke-linejoin="round"/>
  <path d="M370 82 H390 L380 62 Z" fill="#9ca3af" stroke="#1f2937" stroke-width="2" stroke-linejoin="round"/>
  <path d="M369 62 H391" stroke="#1f2937" stroke-width="3"/>
  <circle cx="325" cy="112" r="4.5" fill="#1f2937"/>
  <text x="388" y="102" font-family="sans-serif" font-size="10" font-weight="700" fill="#1f2937">1N4007</text>

  <!-- motor supply -->
  <rect x="430" y="62" width="80" height="56" rx="6" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
  <g font-family="sans-serif" fill="#1f2937">
    <text x="438" y="78" font-size="12" font-weight="700" fill="#b91c1c">+</text>
    <text x="438" y="112" font-size="12" font-weight="700">−</text>
    <text x="474" y="88" font-size="11" font-weight="700" text-anchor="middle">Motor</text>
    <text x="474" y="102" font-size="11" font-weight="700" text-anchor="middle">supply</text>
  </g>

  <!-- common ground -->
  <path d="M130 250 H470 V118" fill="none" stroke="#1f2937" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="250" cy="250" r="4.5" fill="#1f2937"/>
  <circle cx="325" cy="250" r="4.5" fill="#1f2937"/>

  <text x="40" y="274" font-family="sans-serif" font-size="10.5" fill="#4b5563">NPN transistor (2N2222, TIP120): same circuit with 1 kΩ to the base; collector = D, emitter = S.</text>
</svg>
