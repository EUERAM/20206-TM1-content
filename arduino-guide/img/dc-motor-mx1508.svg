<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 280" role="img" aria-labelledby="title desc">
  <title id="title">Driving a DC motor with an MX1508 driver</title>
  <desc id="desc">Arduino PWM pins 5 and 6 go to IN1 and IN2 of an MX1508 driver. The motor connects to the MOTOR-A outputs. A separate 2 to 10 volt motor supply connects to the driver's plus and minus, and the Arduino GND is connected to the minus as well.</desc>
  <rect width="560" height="280" rx="18" fill="#eef0f8"/>
  <rect x="20" y="20" width="520" height="240" rx="12" fill="#fff"/>

  <!-- Arduino -->
  <text x="40" y="44" font-family="sans-serif" font-size="12" font-weight="700" fill="#1f2937">Arduino</text>
  <rect x="40" y="52" width="90" height="170" rx="8" fill="#0f766e"/>
  <g font-family="sans-serif" font-weight="700" fill="#fff" font-size="13" text-anchor="end">
    <text x="122" y="85">~5</text>
    <text x="122" y="110">~6</text>
    <text x="122" y="215">GND</text>
  </g>

  <!-- MX1508 -->
  <text x="230" y="44" font-family="sans-serif" font-size="12" font-weight="700" fill="#1f2937">MX1508 driver</text>
  <rect x="230" y="52" width="130" height="165" rx="8" fill="#dc2626" fill-opacity=".1" stroke="#dc2626" stroke-width="2"/>
  <g font-family="sans-serif" font-size="11" fill="#1f2937">
    <text x="238" y="84">IN1</text>
    <text x="238" y="109">IN2</text>
    <text x="238" y="134" fill="#9ca3af">IN3</text>
    <text x="238" y="159" fill="#9ca3af">IN4</text>
    <text x="352" y="84" text-anchor="end">MOTOR-A</text>
    <text x="352" y="104" text-anchor="end">MOTOR-A</text>
    <text x="352" y="134" fill="#9ca3af" text-anchor="end">MOTOR-B</text>
    <text x="352" y="179" text-anchor="end">+</text>
    <text x="352" y="204" text-anchor="end">−</text>
  </g>

  <!-- control wires -->
  <path d="M130 80 H230" stroke="#f97316" stroke-width="4"/>
  <path d="M130 105 H230" stroke="#2563eb" stroke-width="4"/>

  <!-- motor -->
  <path d="M360 80 H400 V84 H447 M360 100 H400 V96 H447" fill="none" stroke="#6b7280" stroke-width="4" stroke-linejoin="round"/>
  <circle cx="472" cy="90" r="25" fill="#e5e7eb" stroke="#1f2937" stroke-width="3"/>
  <text x="472" y="96" font-family="sans-serif" font-size="18" font-weight="700" fill="#1f2937" text-anchor="middle">M</text>

  <!-- motor supply -->
  <path d="M360 175 H420" stroke="#dc2626" stroke-width="4"/>
  <path d="M360 200 H420" stroke="#1f2937" stroke-width="4"/>
  <rect x="420" y="162" width="96" height="52" rx="6" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
  <g font-family="sans-serif" fill="#1f2937">
    <text x="428" y="180" font-size="12" font-weight="700" fill="#b91c1c">+</text>
    <text x="428" y="206" font-size="12" font-weight="700">−</text>
    <text x="472" y="184" font-size="11" font-weight="700" text-anchor="middle">Motor</text>
    <text x="472" y="198" font-size="11" font-weight="700" text-anchor="middle">supply</text>
    <text x="468" y="230" font-size="10" fill="#6b7280" text-anchor="middle">2–10 V, e.g. 4 × AA</text>
  </g>

  <!-- common ground -->
  <path d="M130 210 H160 V236 H390 V200" fill="none" stroke="#1f2937" stroke-width="4" stroke-linejoin="round"/>
  <circle cx="390" cy="200" r="5" fill="#1f2937"/>

  <text x="40" y="252" font-family="sans-serif" font-size="11" fill="#4b5563">No enable pin: PWM on IN1 or IN2 sets speed and direction. All grounds are connected.</text>
</svg>
