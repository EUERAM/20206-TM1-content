<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 260" role="img" aria-labelledby="title desc">
  <title id="title">Wiring a button and a potentiometer</title>
  <desc id="desc">Left: a pushbutton connects digital pin 2 to GND, using the internal pull-up resistor. Right: a potentiometer has its outer legs on 5V and GND and its middle leg on analog pin A0.</desc>
  <rect width="560" height="260" rx="18" fill="#eef0f8"/>
  <rect x="20" y="20" width="250" height="220" rx="12" fill="#fff"/>
  <rect x="290" y="20" width="250" height="220" rx="12" fill="#fff"/>
  <g font-family="sans-serif" fill="#1f2937">
    <text x="40" y="48" font-size="15" font-weight="700" fill="#4f46e5">Button (digital)</text>
    <text x="310" y="48" font-size="15" font-weight="700" fill="#c2410c">Potentiometer (analog)</text>
  </g>
  <rect x="40" y="90" width="60" height="100" rx="6" fill="#0f766e"/>
  <g font-family="sans-serif" font-size="12" fill="#fff" font-weight="700">
    <text x="50" y="118">D2</text><text x="48" y="170">GND</text>
  </g>
  <path d="M100 114 H160 M210 114 H240 V166 H100" fill="none" stroke="#1f2937" stroke-width="3"/>
  <path d="M160 114 L200 98" stroke="#1f2937" stroke-width="3" stroke-linecap="round"/>
  <circle cx="160" cy="114" r="4" fill="#1f2937"/><circle cx="210" cy="114" r="4" fill="#1f2937"/>
  <path d="M170 88 H195 M182 88 V102" stroke="#1f2937" stroke-width="3"/>
  <g font-family="sans-serif" font-size="11" fill="#4b5563">
    <text x="40" y="214">pinMode(2, INPUT_PULLUP);</text>
    <text x="40" y="230">pressed → LOW · released → HIGH</text>
  </g>
  <rect x="310" y="80" width="60" height="120" rx="6" fill="#0f766e"/>
  <g font-family="sans-serif" font-size="12" fill="#fff" font-weight="700">
    <text x="322" y="104">5V</text><text x="322" y="144">A0</text><text x="318" y="184">GND</text>
  </g>
  <rect x="440" y="90" width="22" height="90" rx="4" fill="#fde68a" stroke="#1f2937" stroke-width="2"/>
  <path d="M480 140 H464 m8 -7 l-8 7 l8 7" fill="none" stroke="#c2410c" stroke-width="3" stroke-linejoin="round"/>
  <path d="M370 100 H451 V90 M370 180 H451 V180 M370 140 H420 V200 H500 V140 H480" fill="none" stroke="#1f2937" stroke-width="3" stroke-linejoin="round"/>
  <g font-family="sans-serif" font-size="11" fill="#4b5563">
    <text x="310" y="222">analogRead(A0) → 0 … 1023</text>
  </g>
</svg>
