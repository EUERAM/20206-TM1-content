<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 260" role="img" aria-labelledby="title desc">
  <title id="title">Wiring a MAX9814 or MAX4466 amplified microphone</title>
  <desc id="desc">The microphone module's Out pin goes to analog pin A0, Vdd to the 3.3V pin, and GND to GND. On the MAX9814, the Gain and AR pins are left unconnected.</desc>
  <rect width="560" height="260" rx="18" fill="#eef0f8"/>
  <rect x="20" y="20" width="520" height="220" rx="12" fill="#fff"/>

  <!-- Arduino -->
  <text x="44" y="44" font-family="sans-serif" font-size="12" font-weight="700" fill="#1f2937">Arduino</text>
  <rect x="44" y="52" width="96" height="160" rx="8" fill="#0f766e"/>
  <g font-family="sans-serif" font-weight="700" fill="#fff" font-size="14" text-anchor="end">
    <text x="132" y="105">A0</text>
    <text x="132" y="140">3.3V</text>
    <text x="132" y="175">GND</text>
  </g>

  <!-- wires -->
  <path d="M140 100 H340" stroke="#eab308" stroke-width="4"/>
  <path d="M140 135 H340" stroke="#dc2626" stroke-width="4"/>
  <path d="M140 170 H340" stroke="#1f2937" stroke-width="4"/>

  <!-- module -->
  <text x="340" y="44" font-family="sans-serif" font-size="12" font-weight="700" fill="#1f2937">MAX9814</text>
  <rect x="340" y="52" width="150" height="160" rx="8" fill="#9333ea" fill-opacity=".14" stroke="#9333ea" stroke-width="2"/>
  <g font-family="sans-serif" font-size="12" fill="#1f2937">
    <text x="350" y="75" fill="#9ca3af">AR</text>
    <text x="350" y="105">Out</text>
    <text x="350" y="140">Vdd</text>
    <text x="350" y="175">GND</text>
    <text x="350" y="200" fill="#9ca3af">Gain</text>
  </g>
  <g font-family="sans-serif" font-size="10" fill="#9ca3af">
    <text x="378" y="75">not connected</text>
    <text x="384" y="200">not connected</text>
  </g>
  <!-- microphone -->
  <circle cx="455" cy="128" r="24" fill="#d1d5db" stroke="#1f2937" stroke-width="2"/>
  <circle cx="455" cy="128" r="15" fill="#374151"/>
  <text x="455" y="166" font-family="sans-serif" font-size="10" fill="#4b5563" text-anchor="middle">microphone</text>

  <text x="160" y="93" font-family="sans-serif" font-size="11" fill="#a16207">audio signal</text>
  <text x="44" y="230" font-family="sans-serif" font-size="11" fill="#4b5563">MAX4466: same wiring with only three pins (OUT, VCC, GND). 3.3 V gives a quieter signal than 5 V.</text>
</svg>
