<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 260" role="img" aria-labelledby="title desc">
  <title id="title">Wiring an SG90 servo</title>
  <desc id="desc">The servo's red wire goes to the Arduino's 5V pin, the brown wire to GND, and the orange signal wire to digital pin 9.</desc>
  <rect width="560" height="260" rx="18" fill="#eef0f8"/>
  <rect x="20" y="20" width="520" height="220" rx="12" fill="#fff"/>

  <!-- Arduino -->
  <rect x="44" y="60" width="96" height="140" rx="8" fill="#0f766e"/>
  <g font-family="sans-serif" font-weight="700" fill="#fff" font-size="14" text-anchor="end">
    <text x="132" y="95">5V</text>
    <text x="132" y="135">GND</text>
    <text x="132" y="175">~9</text>
  </g>
  <text x="44" y="52" font-family="sans-serif" font-size="12" font-weight="700" fill="#1f2937">Arduino</text>

  <!-- wires -->
  <path d="M140 90 H270 V116 H380" fill="none" stroke="#dc2626" stroke-width="4" stroke-linejoin="round"/>
  <path d="M140 130 H380" fill="none" stroke="#78350f" stroke-width="4"/>
  <path d="M140 170 H300 V144 H380" fill="none" stroke="#f97316" stroke-width="4" stroke-linejoin="round"/>

  <!-- servo -->
  <rect x="380" y="98" width="120" height="64" rx="6" fill="#2563eb"/>
  <rect x="420" y="84" width="40" height="14" rx="3" fill="#1d4ed8"/>
  <path d="M410 78 H470" stroke="#fff" stroke-width="8" stroke-linecap="round"/>
  <path d="M410 78 H470" stroke="#d1d5db" stroke-width="8" stroke-linecap="round" stroke-opacity=".6"/>
  <circle cx="440" cy="78" r="5" fill="#9ca3af"/>

  <g font-family="sans-serif" fill="#1f2937">
    <text x="160" y="83" font-size="11" fill="#b91c1c">red → 5V</text>
    <text x="160" y="123" font-size="11" fill="#78350f">brown → GND</text>
    <text x="160" y="163" font-size="11" fill="#c2410c">orange → signal</text>
    <text x="440" y="186" font-size="13" font-weight="700" text-anchor="middle">SG90 servo</text>
    <text x="44" y="226" font-size="11" fill="#4b5563">One SG90 can use the Arduino's 5V. Several servos need an external 5 V supply with a shared GND.</text>
  </g>
</svg>
