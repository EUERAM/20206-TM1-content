<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 260" role="img" aria-labelledby="title desc">
  <title id="title">Wiring a KY-037 / KY-038 sound sensor</title>
  <desc id="desc">The sound module's AO pin goes to analog pin A0, G to GND, plus to 5V, and DO to digital pin 2.</desc>
  <rect width="560" height="260" rx="18" fill="#eef0f8"/>
  <rect x="20" y="20" width="520" height="220" rx="12" fill="#fff"/>

  <!-- Arduino -->
  <text x="44" y="44" font-family="sans-serif" font-size="12" font-weight="700" fill="#1f2937">Arduino</text>
  <rect x="44" y="52" width="96" height="160" rx="8" fill="#0f766e"/>
  <g font-family="sans-serif" font-weight="700" fill="#fff" font-size="14" text-anchor="end">
    <text x="132" y="85">A0</text>
    <text x="132" y="120">GND</text>
    <text x="132" y="155">5V</text>
    <text x="132" y="190">2</text>
  </g>

  <!-- wires -->
  <path d="M140 80 H340" stroke="#eab308" stroke-width="4"/>
  <path d="M140 115 H340" stroke="#1f2937" stroke-width="4"/>
  <path d="M140 150 H340" stroke="#dc2626" stroke-width="4"/>
  <path d="M140 185 H340" stroke="#2563eb" stroke-width="4"/>

  <!-- module -->
  <text x="340" y="44" font-family="sans-serif" font-size="12" font-weight="700" fill="#1f2937">KY-037 / KY-038</text>
  <rect x="340" y="52" width="150" height="160" rx="8" fill="#dc2626" fill-opacity=".14" stroke="#dc2626" stroke-width="2"/>
  <g font-family="sans-serif" font-size="12" fill="#1f2937">
    <text x="350" y="85">AO</text>
    <text x="350" y="120">G</text>
    <text x="350" y="155">+</text>
    <text x="350" y="190">DO</text>
  </g>
  <!-- trimmer -->
  <rect x="400" y="70" width="26" height="26" rx="3" fill="#2563eb"/>
  <circle cx="413" cy="83" r="6" fill="#facc15"/>
  <text x="413" y="110" font-family="sans-serif" font-size="10" fill="#4b5563" text-anchor="middle">trimmer</text>
  <!-- microphone -->
  <circle cx="455" cy="160" r="26" fill="#d1d5db" stroke="#1f2937" stroke-width="2"/>
  <circle cx="455" cy="160" r="17" fill="#374151"/>
  <text x="455" y="200" font-family="sans-serif" font-size="10" fill="#4b5563" text-anchor="middle">microphone</text>

  <g font-family="sans-serif" font-size="11">
    <text x="160" y="73" fill="#a16207">analog level</text>
    <text x="160" y="178" fill="#1d4ed8">digital: loud / quiet</text>
  </g>
  <text x="44" y="230" font-family="sans-serif" font-size="11" fill="#4b5563">Use AO to measure loudness, DO for simple triggers. The trimmer sets the DO threshold.</text>
</svg>
