<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 260" role="img" aria-labelledby="title desc">
  <title id="title">Button interaction states</title>
  <desc id="desc">Four button samples demonstrate default, hover, pressed, and disabled appearances.</desc>
  <rect width="560" height="260" rx="18" fill="#eef0f8"/>
  <rect x="20" y="20" width="520" height="220" rx="12" fill="#fff"/>
  <g font-family="Arial, sans-serif" font-size="13" font-weight="700">
    <rect x="35" y="65" width="112" height="52" rx="9" fill="#4f46e5"/>
    <text x="91" y="96" fill="#fff" text-anchor="middle">Save</text>
    <text x="91" y="150" fill="#6b7280" text-anchor="middle" font-size="11" font-weight="400">Default</text>

    <rect x="165" y="65" width="112" height="52" rx="9" fill="#3730a3"/>
    <text x="221" y="96" fill="#fff" text-anchor="middle">Save</text>
    <text x="221" y="150" fill="#6b7280" text-anchor="middle" font-size="11" font-weight="400">Hover</text>

    <rect x="295" y="65" width="112" height="52" rx="9" fill="#312e81"/>
    <text x="351" y="96" fill="#fff" text-anchor="middle">Saving…</text>
    <text x="351" y="150" fill="#6b7280" text-anchor="middle" font-size="11" font-weight="400">Pressed / loading</text>

    <rect x="425" y="65" width="112" height="52" rx="9" fill="#e5e7eb"/>
    <text x="481" y="96" fill="#9ca3af" text-anchor="middle">Save</text>
    <text x="481" y="150" fill="#6b7280" text-anchor="middle" font-size="11" font-weight="400">Disabled</text>
  </g>
  <rect x="52" y="187" width="456" height="30" rx="8" fill="#ecfdf5"/>
  <circle cx="72" cy="202" r="7" fill="#16a34a"/>
  <path d="m68 202 3 3 6-7" fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"/>
  <text x="88" y="207" fill="#166534" font-family="Arial, sans-serif" font-size="12">Saved successfully</text>
</svg>
